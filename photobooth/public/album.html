<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF4DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photos">
<title>Party photos 📸</title>
<link rel="icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  /* Guest page (served at /a/<token>[/<session>]): words allowed. Tokens + stickers per ../DESIGN.md; `npm run lint` checks it. */
  @font-face { font-family:"Lilita"; src:url("/fonts/lilita-one.woff2") format("woff2"); font-display:swap; }
  :root {
    --paper:#FFF4DC; --ink:#1A1423; --white:#FFFFFF;
    --pink:#FF5DA2; --sun:#FFD23F; --mint:#2EE6A6; --sky:#3EC1FF; --grape:#9B6BFF; --tomato:#FF6B4A;
    --accent:var(--sun); --accent-2:var(--tomato);
    --line:4px; --line-fat:6px;
    --shadow-sm:3px 3px 0 var(--ink); --shadow:6px 6px 0 var(--ink); --shadow-lg:10px 10px 0 var(--ink);
    --r:24px;
    --font-display:"Lilita", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
    --font-body:ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
    --dots:radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1.6px, transparent 1.8px);
    --receipt:color-mix(in srgb, var(--white) 72%, var(--paper));
    --zz:14px;
    --zigzag:
      conic-gradient(from -45deg at bottom, transparent, var(--ink) 1deg 89deg, transparent 90deg) bottom / var(--zz) 51% repeat-x,
      conic-gradient(from 135deg at top, transparent, var(--ink) 1deg 89deg, transparent 90deg) top / var(--zz) 51% repeat-x;
    --zzfill:linear-gradient(var(--ink), var(--ink)) center / 100% calc(100% - var(--zz)) no-repeat;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100dvh; color:var(--ink); background:var(--paper); background-image:var(--dots); background-size:22px 22px;
    font-family:var(--font-body); padding:calc(env(safe-area-inset-top) + 18px) 14px 60px; }
  button, a { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .emoji { font-family:var(--font-emoji); line-height:1; }
  .sticker { background:var(--white); border:var(--line) solid var(--ink); box-shadow:var(--shadow); border-radius:var(--r);
    transform:rotate(var(--tilt, 0deg)); transition:transform .14s var(--ease-pop), box-shadow .14s; }
  button.sticker:active, a.sticker:active { transform:translate(4px,4px) rotate(var(--tilt, 0deg)) scale(.97); box-shadow:var(--shadow-sm); }
  @keyframes pop-in { 0% { transform:scale(.6) rotate(-8deg); opacity:0 } 100% { transform:scale(1) rotate(var(--tilt,0deg)); opacity:1 } }
  @keyframes bob { 0%,100% { translate:0 0 } 50% { translate:0 -6px } }

  header { max-width:1100px; margin:0 auto 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  #logo { width:64px; height:64px; display:flex; align-items:center; justify-content:center; font-size:36px; background:var(--accent); border-radius:50%; --tilt:-8deg; }
  .title { flex:1; min-width:200px; }
  h1 { font-family:var(--font-display); font-weight:400; font-size:clamp(28px, 6vw, 40px); margin:0; line-height:1.05; }
  .sub { font-weight:700; opacity:.75; }
  .pill { display:inline-block; padding:10px 16px; border-radius:999px; font-weight:800; text-decoration:none; font-size:15px; }
  .pill.go { background:var(--mint); } .pill.hot { background:var(--sun); }
  .pill:disabled { opacity:.5; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #status { max-width:1100px; margin:0 auto 14px; font-weight:700; min-height:1.3em; }

  /* The printed receipt is the hero everywhere: the exact 1-bit strip, dot for dot (never smoothed), on receipt
     paper with torn edges, a hard ink shadow and a slight tilt. Paper tint = multiply; ink tint = lighten. */
  .receipt { position:relative; width:min(100%, 440px); margin:0 auto; rotate:-1.5deg; }
  .receipt::before { content:""; position:absolute; inset:0; translate:10px 10px; background:var(--ink); mask:var(--zigzag), var(--zzfill); }
  .paper { position:relative; isolation:isolate; padding:var(--zz) 0; background:var(--receipt); mask:var(--zigzag), var(--zzfill); }
  .paper::after { content:""; position:absolute; inset:0; background:var(--ink); mix-blend-mode:lighten; pointer-events:none; }
  .paper img.bits { display:block; width:100%; height:auto; image-rendering:crisp-edges; image-rendering:pixelated; mix-blend-mode:multiply; }
  .receipt.pending .paper::after { display:none; }
  .receipt.pending .paper { padding:calc(var(--zz) + 22px) 22px calc(var(--zz) + 26px); display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center; font-weight:800; font-size:18px; }
  .receipt.pending .bob { font-size:50px; animation:bob 1.2s infinite; }
  .receipt.pending .photo { width:100%; border:var(--line) solid var(--ink); border-radius:6px; rotate:1.2deg; }
  .receipt.pending .dash { width:100%; border-top:3px dashed var(--ink); opacity:.5; }

  #mine { max-width:1100px; margin:0 auto 26px; padding:16px; background:color-mix(in srgb, var(--accent) 35%, var(--white)); }
  #mine h2, #mine h3 { font-family:var(--font-display); font-weight:400; font-size:28px; margin:0 0 14px; }
  #mine h3 { font-size:20px; margin:0 0 8px; }
  #mine .wait { font-weight:800; font-size:18px; display:flex; gap:12px; align-items:center; }
  #mine .wait .emoji { font-size:40px; animation:bob 1.2s infinite; }
  .stage { display:grid; gap:24px; grid-template-columns:minmax(0, 1fr); align-items:start; }
  @media (min-width:820px) { .stage { grid-template-columns:minmax(0, 440px) minmax(0, 1fr); } }
  .stage aside { display:flex; flex-direction:column; gap:16px; }
  .colours { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px; max-width:1100px; margin:0 auto; }
  .card { padding:10px; display:flex; flex-direction:column; gap:10px; animation:pop-in .35s var(--ease-pop) backwards; }
  .card:nth-child(3n+1) { --tilt:-.7deg; } .card:nth-child(3n+2) { --tilt:.5deg; }
  .card.me { outline:6px solid var(--accent); }
  .card .top { display:flex; align-items:center; gap:8px; font-weight:800; }
  .card .top .t { font-family:var(--font-display); font-weight:400; font-size:20px; flex:1; }
  /* Grid tile: the top of the receipt (first photo + header art), torn off at the bottom. */
  .tile { display:block; width:100%; padding:0 10px 10px 0; border:0; background:none; }
  .tile .receipt { width:100%; rotate:-1deg; }
  .tile .paper { aspect-ratio:4 / 5; overflow:hidden; }
  .tile .paper img.bits { height:100%; object-fit:cover; object-position:top; }
  .tile.colour .paper::after { display:none; }
  .tile.colour .paper img { display:block; width:100%; height:100%; object-fit:cover; }
  .chip { position:absolute; left:10px; bottom:calc(var(--zz) + 8px); z-index:1; padding:4px 10px; border-radius:999px; background:var(--sun); border:3px solid var(--ink); font-weight:800; font-size:13px; }
  .mini { display:flex; gap:6px; flex-wrap:wrap; }
  .mini .thumb { width:44px; }
  .thumb { display:block; width:100%; padding:0; border:3px solid var(--ink); border-radius:10px; overflow:hidden; background:var(--paper); aspect-ratio:4 / 3; }
  .thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .none { opacity:.6; font-size:13px; font-weight:700; padding:6px; }
  .tiny { font-size:13px; padding:6px 10px; }

  #view { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; gap:12px;
    padding:16px; background:color-mix(in srgb, var(--ink) 90%, transparent); }
  #view.on { display:flex; }
  #viewPane { flex:1; min-height:0; width:100%; overflow:auto; display:flex; justify-content:center; align-items:center; overscroll-behavior:contain; }
  #view img { display:block; max-width:100%; max-height:calc(100dvh - 130px); border:var(--line) solid var(--white); border-radius:12px; background:var(--white); }
  #view:not(.bw) .receipt, #view:not(.bw) .paper { display:contents; }
  #view:not(.bw) .receipt::before, #view:not(.bw) .paper::after { display:none; }
  #view.bw #viewPane { align-items:flex-start; padding:6px 12px 22px; }
  #view.bw .receipt { width:min(100%, 520px); }
  #view.bw img { max-height:none; border:0; border-radius:0; background:none; }
  #view .nav { position:absolute; top:50%; translate:0 -50%; width:56px; height:56px; border-radius:50%; font-size:26px; z-index:2; }
  #view .prev { left:10px; } #view .next { right:10px; }

  /* ---------- slideshow (?show=1): for a TV / tablet at the party. The receipt feeds up through the screen. ---------- */
  #show { position:fixed; inset:0; z-index:30; background:var(--ink); display:none; align-items:center; justify-content:center; overflow:hidden; }
  #show.on { display:flex; }
  /* receipt dead centre (clear of the QR corner); the colour photo in the left column */
  #slide { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; column-gap:4vw; width:100%; height:100%; transition:opacity .5s; }
  #slide .slot { grid-column:2; grid-row:1; }
  #slide.fade { opacity:0; }
  #slide .slot { height:100%; overflow:hidden; display:flex; align-items:flex-start; padding:4vh 0; }
  #slide .slot .receipt { width:var(--rw, 576px); margin:0; animation:feed var(--feed-ms, 0s) ease-in-out 1.4s forwards; }
  @keyframes feed { to { translate:0 calc(-1 * var(--feed-dist, 0px)); } }
  @media (prefers-reduced-motion: reduce) { #slide .slot .receipt { animation:none; } }
  #slide .side { grid-column:1; grid-row:1; justify-self:end; width:min(24vw, 440px); padding:10px; --tilt:3deg; }
  #slide .side img { display:block; width:100%; border-radius:12px; }
  #slide .solo { grid-column:2; max-width:80vw; max-height:84vh; border:var(--line-fat) solid var(--white); border-radius:18px; box-shadow:var(--shadow-lg); }
  #slide .wait { position:absolute; left:50%; top:5vh; translate:-50% 0; font-size:clamp(16px, 2.4vmin, 28px); padding:8px 16px; }
  @media (max-aspect-ratio:1/1) { #slide .side { display:none; } }
  #show .corner { position:absolute; right:22px; bottom:22px; display:flex; gap:14px; align-items:center; padding:12px 16px; }
  #show .corner .qr { width:clamp(90px, 14vmin, 170px); }
  #show .corner .qr svg { display:block; width:100%; height:auto; }
  #show .corner b { font-family:var(--font-display); font-weight:400; font-size:clamp(18px, 2.6vmin, 30px); max-width:12ch; line-height:1.1; }
  #show .x { position:absolute; left:18px; top:18px; padding:8px 14px; opacity:.4; }
</style>
</head>
<body>
<header>
  <div id="logo" class="sticker emoji" aria-hidden="true">📸</div>
  <div class="title"><h1 id="name">Party photos</h1><div class="sub" id="sub"></div></div>
  <div class="row">
    <button class="sticker pill go" id="zip" disabled>⬇️ Download all</button>
    <button class="sticker pill" id="showBtn">📺 Slideshow</button>
  </div>
</header>
<section id="mine" class="sticker" hidden></section>
<div id="status" role="status">Loading…</div>
<div id="grid"></div>

<div id="view" role="dialog" aria-label="Photo">
  <button class="sticker nav prev emoji" id="prev" aria-label="Previous">◀</button>
  <div id="viewPane"><div class="receipt"><div class="paper"><img id="viewImg" alt=""></div></div></div>
  <button class="sticker nav next emoji" id="next" aria-label="Next">▶</button>
  <div class="row">
    <a class="sticker pill go" id="viewSave">⬇️ Save</a>
    <button class="sticker pill hot" id="viewShare" hidden>📤 Share</button>
    <button class="sticker pill" id="viewClose">✖️ Close</button>
  </div>
</div>

<div id="show" aria-label="Slideshow">
  <div id="slide"></div>
  <div class="corner sticker"><div class="qr" id="showQR"></div><b>Scan for your photos 📲</b></div>
  <button class="sticker pill x" id="showX" aria-label="Exit slideshow">✖️</button>
</div>

<script type="module">
import { zipStore } from "/archive-codecs.js";
import { THEMES } from "/frames.js";
import { qrSVG } from "/qr.js";

const $ = (id) => document.getElementById(id);
const [, , token, mineId] = location.pathname.replace(/\/$/, "").split("/");
const params = new URLSearchParams(location.search);
const setStatus = (t) => { $("status").textContent = t; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fileURL = (key, dl) => `/api/album/${token}/file?key=${encodeURIComponent(key)}${dl ? "&dl=1" : ""}`;
const pin = (() => { try { return JSON.parse(localStorage.getItem("booth.pin") || '""'); } catch { return ""; } })();
const UI = { turkey: "--tomato", feast: "--sun", leaves: "--tomato", starry: "--grape", harvest: "--sun", stars: "--sun", hearts: "--pink", party: "--sky", dino: "--mint", space: "--grape", film: "--tomato" };

let event = null, sessions = [], seen = new Set();
const time = (s) => new Date(s.meta?.capturedAt ?? 0).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const origs = (s) => Object.keys(s.files).filter((n) => n.startsWith("orig-")).sort();
const stripOf = (s) => s.files["strip.png"] ?? null;
/** Every viewable picture in album order: [{ s, name, key }] — the printed receipt first, then the colour originals. */
const pictures = () => sessions.flatMap((s) => [...(stripOf(s) ? ["strip.png"] : []), ...origs(s)].map((name) => ({ s, name, key: s.files[name] })));
const receiptHTML = (key, alt, cls = "") => `<div class="receipt ${cls}"><div class="paper"><img class="bits" src="${esc(fileURL(key))}" alt="${alt}"></div></div>`;

async function load() {
  const res = await fetch(`/api/album/${token}`, { cache: "no-store" });
  if (res.status === 404) { setStatus("This album link doesn't work (it may have been replaced). Ask the host for the new one."); $("name").textContent = "Album not found"; throw new Error("gone"); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  ({ event, sessions } = await res.json());
  document.title = `${event.name} 📸`;
  $("name").textContent = event.name;
  if (UI[event.theme]) document.documentElement.style.setProperty("--accent", `var(${UI[event.theme]})`);
  $("logo").textContent = THEMES[event.theme]?.icon ?? "📸";
  const n = sessions.length;
  $("sub").textContent = [event.date && new Date(event.date + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }),
    `${n} photo session${n === 1 ? "" : "s"}`].filter(Boolean).join(" · ");
  $("zip").disabled = !n;
  setStatus(n ? "" : "No photos yet — they show up here a few seconds after each strip prints.");
  render();
}

function card(s) {
  const m = s.meta ?? {}, o = origs(s), st = stripOf(s);
  // The tile is the receipt (its top: header art + first photo); no strip yet → the colour photo, marked "printing…".
  const tile = st ? `<button class="tile" data-key="${esc(st)}" aria-label="Printed receipt">${receiptHTML(st, "Printed receipt")}</button>`
    : o.length ? `<button class="tile colour" data-key="${esc(s.files[o[0]])}" aria-label="Photo 1"><div class="receipt"><div class="paper">
        <img loading="lazy" src="${esc(fileURL(s.files[o[0]]))}" alt="Photo 1"><span class="chip">🖨️ printing…</span></div></div></button>`
    : `<div class="none">📤 uploading…</div>`;
  return `<article class="card sticker ${s.id === mineId ? "me" : ""}" data-id="${s.id}" id="s-${s.id}">
    <div class="top"><span class="emoji">${THEMES[m.theme]?.icon ?? "📸"}</span><span class="t">${time(s)}</span>
      ${pin ? `<button class="sticker pill tiny" data-hide="${s.id}" data-day="${s.day}" title="Hide from album (host only)">🙈</button>` : ""}</div>
    ${tile}
    ${st && o.length ? `<div class="mini" aria-label="Colour photos">${o.map((n) => thumb(s.files[n], `Photo ${n.match(/\d/)[0]}`)).join("")}</div>` : ""}
  </article>`;
}
function thumb(key, label) {
  return `<button class="thumb" data-key="${esc(key)}" aria-label="${label}"><img loading="lazy" src="${fileURL(key)}" alt="${label}"></button>`;
}

let waitT = null, waitUntil = Date.now() + 10 * 60000, mineSig = "";
const sig = (s) => s.id + origs(s).length + (stripOf(s) ? "r" : "");
function render() {
  const fresh = sessions.filter((s) => !seen.has(sig(s)));
  if (fresh.length || !$("grid").children.length) $("grid").innerHTML = sessions.map((s) => card(s)).join("");
  sessions.forEach((s) => seen.add(sig(s)));
  if (mineId) renderMine();
}

/** /a/<token>/<session>: that guest's receipt at the top, big; the colour photos below/beside it. */
function renderMine() {
  const me = sessions.find((s) => s.id === mineId);
  const o = me ? origs(me) : [], st = me && stripOf(me);
  const done = st && o.length >= (me.meta?.shots ?? 1);
  const late = Date.now() >= waitUntil;
  $("mine").hidden = false;
  clearTimeout(waitT);
  if (!done && !late) waitT = setTimeout(() => load().catch(() => {}), 4000);   // keep polling until the receipt lands
  const key = [st, o.length, late].join();
  if (key === mineSig) return;
  mineSig = key;
  if (!st && !o.length) {
    $("mine").innerHTML = late
      ? `<div class="wait"><span class="emoji">🤔</span>Your photos haven't arrived yet. They'll appear below once the booth is back online.</div>`
      : `<div class="wait"><span class="emoji">📤</span>Your photos are on their way from the booth — this page updates by itself.</div>`;
    return;
  }
  const hero = st ? receiptHTML(st, "Your printed receipt")
    : `<div class="receipt pending"><div class="paper"><span class="bob emoji" aria-hidden="true">🖨️</span>
        <span>${late ? "Your receipt hasn't arrived yet — it will once the booth is back online." : "Printing… your receipt shows up here in a moment."}</span>
        <div class="dash"></div><img class="photo" src="${esc(fileURL(me.files[o[0]]))}" alt="Your photo"></div></div>`;
  $("mine").innerHTML = `<h2>Your receipt ✨</h2><div class="stage"><div id="mineHero">${hero}</div><aside>
      <div class="row">
        ${st ? `<a class="sticker pill go" id="saveReceipt" href="${esc(fileURL(st, true))}">🧾 Save receipt</a>` : ""}
        ${o.length ? `<button class="sticker pill go" id="saveMine">⬇️ Save photos</button>` : ""}
        ${navigator.canShare ? `<button class="sticker pill hot" id="shareMine">📤 Share all</button>` : ""}
      </div>
      ${o.length ? `<div><h3>Also: the colour photos</h3><div class="colours">${o.map((n, i) => thumb(me.files[n], `Your colour photo ${i + 1}`)).join("")}</div></div>` : ""}
    </aside></div>`;
  const mineOrigs = o.map((n) => ({ s: me, name: n, key: me.files[n] }));
  $("saveMine")?.addEventListener("click", () => saveAll(mineOrigs, `${event.slug}-mine`));
  $("shareMine")?.addEventListener("click", () => share([...(st ? [st] : []), ...mineOrigs.map((f) => f.key)]));
  $("mineHero").querySelector(".receipt:not(.pending)")?.addEventListener("click", () => openView(st));
}

// ---------- viewer ----------
let viewIdx = -1;
function openView(key) {
  const list = pictures(); viewIdx = list.findIndex((p) => p.key === key);
  if (viewIdx < 0) return;
  showView();
}
function showView() {
  const list = pictures(), p = list[viewIdx];
  if (!p) return;
  const bw = p.name.endsWith(".png");
  $("view").classList.toggle("bw", bw);
  $("viewImg").className = bw ? "bits" : "";
  $("viewImg").alt = bw ? "Printed receipt" : "Photo";
  $("viewImg").src = fileURL(p.key);
  $("viewPane").scrollTop = 0;
  $("viewSave").href = fileURL(p.key, true);
  $("viewShare").hidden = !navigator.canShare;
  $("view").classList.add("on");
}
const step = (d) => { const n = pictures().length; if (!n) return; viewIdx = (viewIdx + d + n) % n; showView(); };
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("viewShare").onclick = () => share([pictures()[viewIdx].key]);
$("viewClose").onclick = () => $("view").classList.remove("on");
$("view").addEventListener("click", (e) => { if (e.target === $("view") || e.target === $("viewPane")) $("view").classList.remove("on"); });
document.addEventListener("keydown", (e) => {
  if (!$("view").classList.contains("on")) return;
  if (e.key === "Escape") $("view").classList.remove("on");
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
let touchX = null;
$("view").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("view").addEventListener("touchend", (e) => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); touchX = null; });

document.body.addEventListener("click", async (e) => {
  const h = e.target.closest("button[data-hide]");
  if (h) {
    if (!confirm("Hide this session from the album? (The photos stay in the private archive.)")) return;
    const r = await fetch(`/api/events/${event.slug}/detach`, { method: "POST", headers: { "content-type": "application/json", "x-booth-pin": pin }, body: JSON.stringify({ day: h.dataset.day, id: h.dataset.hide }) });
    if (r.ok) { seen.clear(); $("grid").innerHTML = ""; await load(); } else alert("Couldn't hide it (host PIN needed).");
    return;
  }
  const b = e.target.closest("button[data-key]");
  if (b) openView(b.dataset.key);
});

// ---------- save / share ----------
async function blobOf(key) { const r = await fetch(fileURL(key)); if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); }
async function share(keys) {
  try {
    const files = await Promise.all(keys.map(async (k, i) => new File([await blobOf(k)], `${event.slug}-${i + 1}.${k.endsWith(".png") ? "png" : "jpg"}`, { type: k.endsWith(".png") ? "image/png" : "image/jpeg" })));
    if (navigator.canShare?.({ files })) await navigator.share({ files, title: event.name });
    else for (const k of keys) location.href = fileURL(k, true);
  } catch (e) { if (e.name !== "AbortError") setStatus("Couldn't share: " + e.message); }
}
async function saveAll(list, base) {
  // One picture: plain download. Several: a zip (built here, nothing leaves the album).
  if (list.length === 1) { location.href = fileURL(list[0].key, true); return; }
  const entries = [];
  for (const [i, f] of list.entries()) {
    setStatus(`Fetching ${i + 1}/${list.length}…`);
    const at = new Date(f.s.meta?.capturedAt ?? Date.now());
    const folder = at.toLocaleTimeString("en-GB").replaceAll(":", "") + "-" + f.s.id.slice(-4);
    entries.push({ name: `${base}/${folder}/${f.name}`, data: new Uint8Array(await (await blobOf(f.key)).arrayBuffer()), date: at });
  }
  const blob = new Blob(zipStore(entries), { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${base}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  setStatus(`Saved ${base}.zip (${(blob.size / 1048576).toFixed(1)} MB, ${list.length} files)`);
}
$("zip").onclick = async () => {
  $("zip").disabled = true;
  try { await saveAll(pictures(), event.slug); } catch (e) { setStatus("Download failed: " + e.message); }
  finally { $("zip").disabled = false; }
};

// ---------- slideshow ----------
// One slide per session: the receipt big in the middle, shown dot for dot (an integer number of screen
// pixels per printer dot where it fits), feeding up slowly when it's taller than the screen; the colour
// photo small alongside. Sessions that haven't printed yet show their colour photo.
let showT = null, showIdx = 0;
function startShow() {
  $("show").classList.add("on");
  $("showQR").innerHTML = qrSVG(`${location.origin}/a/${token}`);
  document.documentElement.requestFullscreen?.().catch(() => {});
  navigator.wakeLock?.request("screen").catch(() => {});
  showIdx = 0; nextSlide();
}
/** CSS width for the 576-dot strip: ~42% of a landscape screen (90% portrait). On a 1× screen (a TV) it snaps
 *  to whole screen pixels per dot so the dots stay even; dense screens have pixels to spare. */
function receiptWidth() {
  const dpr = devicePixelRatio || 1, max = innerWidth * (innerWidth > innerHeight ? 0.42 : 0.9);
  const k = Math.floor((max * dpr) / 576);
  return dpr < 2 && k >= 1 ? (576 * k) / dpr : max;
}
const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
async function nextSlide() {
  clearTimeout(showT);
  // Printed sessions (receipt + photo); ones still printing show up once their receipt lands,
  // unless nothing has printed yet (then the colour photos stand in).
  const printed = sessions.filter(stripOf), list = printed.length ? printed : sessions.filter((s) => origs(s).length);
  let hold = 6000;
  if (list.length) {
    const s = list[showIdx % list.length]; showIdx++;
    const st = stripOf(s), o = origs(s);
    try {
      const [strip, photo] = await Promise.all([st && loadImg(fileURL(st)), o.length && loadImg(fileURL(s.files[o[0]]))]);
      const w = receiptWidth();
      let html, dist = 0;
      if (strip) {
        const h = (strip.naturalHeight / strip.naturalWidth) * w + 28, room = innerHeight * 0.92;
        dist = Math.max(0, h - room + 24);
        html = `<div class="slot">${receiptHTML(st, "Printed receipt").replace('class="receipt "', `class="receipt" style="--rw:${w}px;--feed-dist:${dist}px;--feed-ms:${Math.round(dist / 0.06)}ms"`)}</div>
          ${photo ? `<div class="side sticker"><img src="${esc(photo.src)}" alt="Colour photo"></div>` : ""}`;
        hold = Math.max(7000, 1400 + dist / 0.06 + 3500);
      } else {
        html = `<img class="solo" src="${esc(photo.src)}" alt="Photo"><div class="wait sticker">🖨️ printing…</div>`;
      }
      $("slide").classList.add("fade");
      await new Promise((r) => setTimeout(r, 450));
      $("slide").innerHTML = html;
      $("slide").classList.remove("fade");
    } catch { /* image failed: skip to the next one */ hold = 500; }
  }
  showT = setTimeout(nextSlide, hold);
}
$("showBtn").onclick = startShow;
$("showX").onclick = () => { $("show").classList.remove("on"); clearTimeout(showT); document.exitFullscreen?.().catch(() => {}); };

// New photos appear by themselves (the slideshow restarts from the newest).
let prevCount = 0;
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  load().then(() => { if (sessions.length > prevCount && $("show").classList.contains("on")) showIdx = 0; prevCount = sessions.length; }).catch(() => {});
}, 30000);

load().then(() => {
  prevCount = sessions.length;
  if (params.get("show") === "1") startShow();
  if (mineId) $("mine").scrollIntoView({ block: "start" });
}).catch((e) => { if (e.message !== "gone") setStatus("Couldn't load the album: " + e.message); });
</script>
