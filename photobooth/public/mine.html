<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF4DC">
<title>Your receipt 🧾</title>
<link rel="icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  /* Guest page for ONE session (served at /s/<token>, expires after a day): words allowed. The printed receipt is the hero.
     Tokens + stickers per ../DESIGN.md (same look as album.html); `npm run lint` checks it. */
  @font-face { font-family:"Lilita"; src:url("/fonts/lilita-one.woff2") format("woff2"); font-display:swap; }
  :root {
    --paper:#FFF4DC; --ink:#1A1423; --white:#FFFFFF;
    --pink:#FF5DA2; --sun:#FFD23F; --mint:#2EE6A6; --sky:#3EC1FF; --grape:#9B6BFF; --tomato:#FF6B4A;
    --accent:var(--sun);
    --line:4px;
    --shadow-sm:3px 3px 0 var(--ink); --shadow:6px 6px 0 var(--ink); --shadow-lg:10px 10px 0 var(--ink);
    --r:24px;
    --font-display:"Lilita", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
    --font-body:ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
    --dots:radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1.6px, transparent 1.8px);
    --receipt:color-mix(in srgb, var(--white) 72%, var(--paper));
    --zz:14px;
    --zigzag:
      conic-gradient(from -45deg at bottom, transparent, var(--ink) 1deg 89deg, transparent 90deg) bottom / var(--zz) 51% repeat-x,
      conic-gradient(from 135deg at top, transparent, var(--ink) 1deg 89deg, transparent 90deg) top / var(--zz) 51% repeat-x;
    --zzfill:linear-gradient(var(--ink), var(--ink)) center / 100% calc(100% - var(--zz)) no-repeat;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100dvh; color:var(--ink); background:var(--paper); background-image:var(--dots); background-size:22px 22px;
    font-family:var(--font-body); padding:calc(env(safe-area-inset-top) + 18px) 14px 60px; }
  button, a { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .emoji { font-family:var(--font-emoji); line-height:1; }
  .sticker { background:var(--white); border:var(--line) solid var(--ink); box-shadow:var(--shadow); border-radius:var(--r);
    transform:rotate(var(--tilt, 0deg)); transition:transform .14s var(--ease-pop), box-shadow .14s; }
  button.sticker:active, a.sticker:active { transform:translate(4px,4px) rotate(var(--tilt, 0deg)) scale(.97); box-shadow:var(--shadow-sm); }
  @keyframes pop-in { 0% { transform:scale(.6) rotate(-8deg); opacity:0 } 100% { transform:scale(1) rotate(var(--tilt,0deg)); opacity:1 } }
  @keyframes bob { 0%,100% { translate:0 0 } 50% { translate:0 -6px } }

  main { max-width:1000px; margin:0 auto; }
  header { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  #logo { width:64px; height:64px; display:flex; align-items:center; justify-content:center; font-size:36px; background:var(--accent); border-radius:50%; --tilt:-8deg; }
  h1 { font-family:var(--font-display); font-weight:400; font-size:clamp(28px, 7vw, 40px); margin:0; line-height:1.05; }
  h2 { font-family:var(--font-display); font-weight:400; font-size:22px; margin:0 0 10px; }
  .sub { font-weight:700; opacity:.75; }
  .pill { display:inline-block; padding:10px 16px; border-radius:999px; font-weight:800; text-decoration:none; font-size:15px; }
  .pill.go { background:var(--mint); } .pill.hot { background:var(--sun); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #status { font-weight:700; min-height:1.3em; margin:0 0 14px; }
  .tiny { font-size:14px; padding:8px 12px; }

  /* The printed receipt is the hero: the exact 1-bit strip, dot for dot (never smoothed), on receipt paper
     with torn edges, a hard ink shadow and a slight tilt. Paper tint = multiply; ink tint = lighten. */
  .stage { display:grid; gap:26px; grid-template-columns:minmax(0, 1fr); align-items:start; }
  @media (min-width:820px) { .stage { grid-template-columns:minmax(0, 440px) minmax(0, 1fr); } }
  .receipt { position:relative; width:min(100%, 440px); margin:0 auto; rotate:-1.5deg; animation:feed-in .5s var(--ease-pop) backwards; }
  .receipt::before { content:""; position:absolute; inset:0; translate:10px 10px; background:var(--ink); mask:var(--zigzag), var(--zzfill); }
  .receipt .paper { position:relative; isolation:isolate; padding:var(--zz) 0; background:var(--receipt); mask:var(--zigzag), var(--zzfill); }
  .receipt .paper::after { content:""; position:absolute; inset:0; background:var(--ink); mix-blend-mode:lighten; pointer-events:none; }
  .receipt img { display:block; width:100%; height:auto; image-rendering:crisp-edges; image-rendering:pixelated; mix-blend-mode:multiply; }
  .receipt.pending .paper::after { display:none; }
  .receipt.pending .paper { padding:calc(var(--zz) + 22px) 22px calc(var(--zz) + 26px); display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center; font-weight:800; font-size:18px; }
  .receipt.pending .bob { font-size:54px; animation:bob 1.2s infinite; }
  .receipt.pending .photo { width:100%; border:var(--line) solid var(--ink); border-radius:6px; rotate:1.2deg; }
  .receipt.pending .dash { width:100%; border-top:3px dashed var(--ink); opacity:.5; }
  @keyframes feed-in { from { translate:0 -40px; } }
  aside { display:flex; flex-direction:column; gap:18px; }
  #acts .pill { font-size:16px; }
  #also { padding:14px; --tilt:.6deg; }
  #thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; }
  .thumb { display:block; width:100%; padding:0; border:3px solid var(--ink); border-radius:12px; overflow:hidden; background:var(--paper); aspect-ratio:4 / 3; }
  .thumb img { display:block; width:100%; height:100%; object-fit:cover; }

  #view { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:16px; background:color-mix(in srgb, var(--ink) 90%, transparent); }
  #view.on { display:flex; }
  #view img { max-width:100%; max-height:calc(100dvh - 130px); border:var(--line) solid var(--white); border-radius:12px; background:var(--white); }
</style>
</head>
<body>
<main>
  <header>
    <div id="logo" class="sticker emoji" aria-hidden="true">🧾</div>
    <div><h1 id="title">Your receipt ✨</h1><div class="sub" id="sub"></div></div>
  </header>
  <div id="status" role="status">Loading…</div>
  <div class="stage" id="stage" hidden>
    <section id="hero" aria-label="Your printed receipt"></section>
    <aside>
      <div class="row" id="acts">
        <a class="sticker pill go" id="saveStrip" hidden>🧾 Save receipt</a>
        <button class="sticker pill go" id="savePhotos" hidden>⬇️ Save photos</button>
        <button class="sticker pill hot" id="shareAll" hidden>📤 Share all</button>
      </div>
      <section id="also" class="sticker" hidden><h2>Also: the colour photos</h2><div id="thumbs"></div></section>
    </aside>
  </div>
</main>

<div id="view" role="dialog" aria-label="Photo">
  <img id="viewImg" alt="">
  <div class="row">
    <a class="sticker pill go" id="viewSave">⬇️ Save</a>
    <button class="sticker pill hot" id="viewShare" hidden>📤 Share</button>
    <button class="sticker pill" id="viewClose">✖️ Close</button>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const token = location.pathname.replace(/\/$/, "").split("/")[2] ?? "";
const fileURL = (key, dl) => `/api/s/${token}/file?key=${encodeURIComponent(key)}${dl ? "&dl=1" : ""}`;
const setStatus = (t) => { $("status").textContent = t; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const canShareFiles = (() => { try { return !!navigator.canShare?.({ files: [new File([""], "x.jpg", { type: "image/jpeg" })] }); } catch { return false; } })();

let session = null, shownSig = "", t0 = Date.now(), pollT = null;
const files = () => session?.files ?? {};
const strip = () => files()["strip.png"] ?? null;
const origs = () => Object.keys(files()).filter((n) => n.startsWith("orig-")).sort().map((name) => ({ name, key: files()[name] }));
/** Everything, receipt first (it's what printed), then the colour originals. */
const pictures = () => [...(strip() ? [{ name: "strip.png", key: strip() }] : []), ...origs()];
const complete = () => !!strip() && origs().length >= (session?.meta?.shots ?? 1);

async function load() {
  const res = await fetch(`/api/s/${token}`, { cache: "no-store" });
  if (res.status === 404) {
    $("title").textContent = "Link expired";
    $("logo").textContent = "⌛";
    $("stage").hidden = true; $("hero").innerHTML = "";
    setStatus("This photo link has expired (they last a day) or doesn't exist. Ask at the booth for a new one.");
    throw new Error("gone");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const body = await res.json();
  session = body.session;
  const at = session.meta?.capturedAt ? new Date(session.meta.capturedAt) : null;
  $("sub").textContent = [at && at.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }),
    `link works until ${new Date(body.expiresAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}`].filter(Boolean).join(" · ");
  setStatus("");
  render();
}

function render() {
  $("stage").hidden = false;
  const o = origs(), st = strip();
  const late = Date.now() - t0 > 10 * 60000;
  const sig = [st, ...o.map((p) => p.key), !complete() && late].join();
  $("saveStrip").hidden = !st;
  if (st) { $("saveStrip").href = fileURL(st, true); $("saveStrip").download = nameOf(st); }
  $("savePhotos").hidden = !o.length;
  $("shareAll").hidden = !canShareFiles || !pictures().length;
  if (sig === shownSig) return;
  shownSig = sig;
  if (st) {
    $("hero").innerHTML = `<div class="receipt" id="receipt"><div class="paper"><img id="stripImg" src="${esc(fileURL(st))}" alt="Your printed receipt strip"></div></div>`;
  } else {
    // Not printed / uploaded yet: a paper placeholder, with the colour photo meanwhile.
    const msg = late ? (o.length ? "Your receipt hasn't arrived yet — it will once the booth is back online."
                                 : "Your photos haven't arrived yet. They'll appear here once the booth is back online.")
      : o.length ? "Printing… your receipt shows up here in a moment." : "On its way from the booth… this page updates by itself.";
    $("hero").innerHTML = `<div class="receipt pending" id="receipt"><div class="paper">
      <span class="bob emoji" aria-hidden="true">${o.length ? "🖨️" : "📤"}</span><span id="waitText">${msg}</span>
      ${o.length ? `<div class="dash"></div><img class="photo" src="${esc(fileURL(o[0].key))}" alt="Your photo">` : ""}</div></div>`;
  }
  $("also").hidden = !o.length;
  $("thumbs").innerHTML = o.map((p, i) => `<button class="thumb" data-key="${esc(p.key)}" aria-label="Colour photo ${i + 1}"><img src="${esc(fileURL(p.key))}" alt="Colour photo ${i + 1}"></button>`).join("");
}

function poll() {
  clearTimeout(pollT);
  if (complete()) return;
  const age = Date.now() - t0;
  if (age > 30 * 60000) return;
  pollT = setTimeout(() => load().then(poll, (e) => { if (e.message !== "gone") poll(); }), age < 3 * 60000 ? 4000 : 15000);
}

// ---------- colour photo viewer ----------
let viewKey = null;
$("thumbs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-key]"); if (!b) return;
  viewKey = b.dataset.key;
  $("viewImg").src = fileURL(viewKey); $("viewSave").href = fileURL(viewKey, true);
  $("viewShare").hidden = !canShareFiles;
  $("view").classList.add("on");
});
$("viewShare").onclick = () => share([viewKey]);
$("viewClose").onclick = () => $("view").classList.remove("on");
$("view").addEventListener("click", (e) => { if (e.target === $("view")) $("view").classList.remove("on"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("view").classList.remove("on"); });

// ---------- save / share ----------
const nameOf = (key) => `photobooth-${key.split("/").pop()}`;
async function fileOf(key) {
  const r = await fetch(fileURL(key)); if (!r.ok) throw new Error("HTTP " + r.status);
  return new File([await r.blob()], nameOf(key), { type: key.endsWith(".png") ? "image/png" : "image/jpeg" });
}
async function share(keys) {
  try {
    const files = await Promise.all(keys.map(fileOf));
    if (navigator.canShare?.({ files })) await navigator.share({ files, title: "Photo booth" });
    else for (const k of keys) location.href = fileURL(k, true);
  } catch (e) { if (e.name !== "AbortError") setStatus("Couldn't share: " + e.message); }
}
$("shareAll").onclick = () => share(pictures().map((p) => p.key));
$("savePhotos").onclick = async () => {
  // One download per photo (no zip: a session is 1–4 files).
  for (const p of origs()) {
    const a = document.createElement("a"); a.href = fileURL(p.key, true); a.download = nameOf(p.key);
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise((r) => setTimeout(r, 400));
  }
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !complete()) load().then(poll, () => {}); });

load().then(poll, (e) => { if (e.message !== "gone") { setStatus("Couldn't load your photos: " + e.message); poll(); } });
</script>
</body>
</html>
