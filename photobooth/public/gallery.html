<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF4DC">
<title>Cheese! archive 📸</title>
<link rel="icon" href="./icons/icon-180.png">
<style>
  /* Adult page (not a kid screen): words allowed. Tokens + stickers per ../DESIGN.md; `npm run lint` checks this file too. */
  @font-face { font-family:"Lilita"; src:url("./fonts/lilita-one.woff2") format("woff2"); font-display:swap; }
  :root {
    --paper:#FFF4DC; --ink:#1A1423; --white:#FFFFFF;
    --pink:#FF5DA2; --sun:#FFD23F; --mint:#2EE6A6; --sky:#3EC1FF; --grape:#9B6BFF; --tomato:#FF6B4A;
    --accent:var(--sun); --accent-2:var(--grape);
    --line:4px; --line-fat:6px;
    --shadow-sm:3px 3px 0 var(--ink); --shadow:6px 6px 0 var(--ink); --shadow-lg:10px 10px 0 var(--ink);
    --r:24px;
    --font-display:"Lilita", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
    --font-body:ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-emoji:"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
    --dots:radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1.6px, transparent 1.8px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100dvh; color:var(--ink); background:var(--paper); background-image:var(--dots); background-size:22px 22px;
    font-family:var(--font-body); padding:calc(env(safe-area-inset-top) + 20px) 16px 60px; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .emoji { font-family:var(--font-emoji); line-height:1; }
  .sticker { background:var(--white); border:var(--line) solid var(--ink); box-shadow:var(--shadow); border-radius:var(--r);
    transform:rotate(var(--tilt, 0deg)); transition:transform .14s var(--ease-pop), box-shadow .14s; }
  button.sticker:active { transform:translate(4px,4px) rotate(var(--tilt, 0deg)) scale(.97); box-shadow:var(--shadow-sm); }
  @keyframes pop-in { 0% { transform:scale(.6) rotate(-8deg); opacity:0 } 100% { transform:scale(1) rotate(var(--tilt,0deg)); opacity:1 } }

  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; max-width:1200px; margin:0 auto 18px; }
  #logo { width:64px; height:64px; display:flex; align-items:center; justify-content:center; font-size:36px; background:var(--sun); border-radius:50%; --tilt:-8deg; }
  h1 { font-family:var(--font-display); font-weight:400; font-size:34px; margin:0; flex:1; }
  .pill { padding:10px 16px; border-radius:999px; font-weight:800; color:var(--ink); text-decoration:none; }
  .pill.go { background:var(--mint); }
  .pill:disabled { opacity:.5; }
  #status { max-width:1200px; margin:0 auto 14px; font-weight:700; min-height:1.3em; }

  #lock { max-width:420px; margin:12vh auto; padding:22px; display:flex; flex-direction:column; gap:14px; font-weight:700; }
  #lock input { padding:12px 14px; border-radius:14px; border:3px solid var(--ink); background:var(--paper); font-family:var(--font-display); font-size:28px; letter-spacing:.2em; text-align:center; }

  #days { display:flex; gap:10px; flex-wrap:wrap; max-width:1200px; margin:0 auto 22px; }
  #days button { padding:8px 14px; border-radius:999px; font-weight:800; font-size:15px; }
  #days button:nth-child(odd) { --tilt:-1.5deg; } #days button:nth-child(even) { --tilt:1.5deg; }
  #days button.sel { background:var(--accent); }
  #days small { opacity:.65; font-weight:700; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; max-width:1200px; margin:0 auto; }
  .card { padding:12px; display:flex; flex-direction:column; gap:10px; animation:pop-in .35s var(--ease-pop) backwards; }
  .card:nth-child(3n+1) { --tilt:-.8deg; } .card:nth-child(3n+2) { --tilt:.6deg; }
  .card .top { display:flex; align-items:center; gap:8px; font-weight:800; }
  .card .top .t { font-family:var(--font-display); font-weight:400; font-size:22px; flex:1; }
  .badge { padding:3px 9px; border-radius:999px; border:3px solid var(--ink); font-size:13px; font-weight:800; background:var(--paper); }
  .badge.printed { background:var(--mint); }
  .pics { display:flex; gap:10px; align-items:flex-start; }
  .strip { flex:0 0 34%; }
  .origs { flex:1; display:grid; grid-template-columns:1fr; gap:8px; }
  .thumb { display:block; width:100%; padding:0; border:3px solid var(--ink); border-radius:12px; overflow:hidden; background:var(--paper); min-height:60px; }
  .thumb img { display:block; width:100%; height:auto; }
  .strip .thumb img { image-rendering:pixelated; }
  .none { opacity:.6; font-size:13px; font-weight:700; padding:6px; }

  #view { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:20px; background:color-mix(in srgb, var(--ink) 88%, transparent); }
  #view.on { display:flex; }
  #view img { max-width:100%; max-height:calc(100dvh - 120px); border:var(--line) solid var(--white); border-radius:12px; background:var(--white); }
  #view.bw img { image-rendering:pixelated; }
  #view .row { display:flex; gap:12px; }
</style>
</head>
<body>
<section id="lock" class="sticker" hidden>
  <div>Photo archive — enter the booth PIN</div>
  <form id="lockForm" style="display:contents">
    <input id="pin" type="password" inputmode="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="PIN">
    <button class="sticker pill go" type="submit">Unlock</button>
  </form>
</section>

<main id="app" hidden>
  <header>
    <div id="logo" class="sticker emoji" aria-hidden="true">📸</div>
    <h1>Cheese! archive</h1>
    <button class="sticker pill go" id="zip" disabled>⬇️ Download day (.zip)</button>
    <button class="sticker pill" id="lockNow">🔒 Lock</button>
  </header>
  <div id="days"></div>
  <div id="status" role="status"></div>
  <div id="grid"></div>
</main>

<div id="view" role="dialog" aria-label="Photo">
  <img id="viewImg" alt="">
  <div class="row">
    <a class="sticker pill go" id="viewSave" download>⬇️ Save</a>
    <button class="sticker pill" id="viewClose">✖️ Close</button>
  </div>
</div>

<script type="module">
import { zipStore } from "./archive-codecs.js";

const $ = (id) => document.getElementById(id);
const ICON = { film: "🎞️", stars: "⭐", hearts: "💖", party: "🎉", dino: "🦖", space: "🚀", plain: "📷" };
const pin = () => { try { return JSON.parse(localStorage.getItem("booth.pin") || '""'); } catch { return ""; } };
const setStatus = (t) => { $("status").textContent = t; };

function lock(msg) {
  localStorage.removeItem("booth.pin");
  $("app").hidden = true; $("lock").hidden = false; $("pin").focus();
  if (msg) $("lock").firstElementChild.textContent = msg;
}
async function api(path) {
  const res = await fetch(path, { headers: { "x-booth-pin": pin() }, cache: "no-store" });
  if (res.status === 401) { lock("Wrong or changed PIN — try again"); throw new Error("locked"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "HTTP " + res.status);
  return res;
}

// Blob cache: key → object URL (+ Blob for zipping). Never puts the PIN in a URL.
const blobs = new Map();
async function fileBlob(key) {
  if (!blobs.has(key)) blobs.set(key, api("/api/photos/file?key=" + encodeURIComponent(key)).then((r) => r.blob()));
  try { return await blobs.get(key); } catch (e) { blobs.delete(key); throw e; }
}
const urls = new Map();
async function fileURL(key) {
  if (!urls.has(key)) urls.set(key, URL.createObjectURL(await fileBlob(key)));
  return urls.get(key);
}
function clearCache() { for (const u of urls.values()) URL.revokeObjectURL(u); urls.clear(); blobs.clear(); }

// Lazy thumbnails, a few at a time.
let active = 0; const waiting = [];
function pump() {
  while (active < 4 && waiting.length) {
    const img = waiting.shift(); active++;
    fileURL(img.dataset.key).then((u) => { img.src = u; }, () => { img.alt = "failed to load"; })
      .finally(() => { active--; pump(); });
  }
}
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { io.unobserve(e.target); waiting.push(e.target); pump(); }
}, { rootMargin: "400px" });

let day = null, sessions = [];
async function loadDays() {
  const { days } = await (await api("/api/photos/days")).json();
  $("days").innerHTML = days.length ? days.map((d) =>
    `<button class="sticker" data-day="${d.day}">${d.day} <small>${d.sessions ?? "…"}</small></button>`).join("")
    : `<div class="none">No photos yet.</div>`;
  for (const b of $("days").querySelectorAll("button")) b.onclick = () => openDay(b.dataset.day);
  const want = new URLSearchParams(location.hash.slice(1)).get("day");
  const first = days.find((d) => d.day === want)?.day ?? days[0]?.day;
  if (first) await openDay(first);
}

const time = (s) => new Date(s.meta?.capturedAt ?? 0).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
async function openDay(d) {
  day = d; history.replaceState(null, "", "#day=" + d);
  for (const b of $("days").querySelectorAll("button")) b.classList.toggle("sel", b.dataset.day === d);
  clearCache(); waiting.length = 0; $("grid").innerHTML = ""; $("zip").disabled = true; setStatus("Loading…");
  ({ sessions } = await (await api("/api/photos?day=" + d)).json());
  if (day !== d) return;
  setStatus(`${sessions.length} session${sessions.length === 1 ? "" : "s"} · ${d}`);
  $("zip").disabled = !sessions.length;
  for (const s of sessions) {
    const m = s.meta ?? {};
    const card = document.createElement("article");
    card.className = "card sticker";
    const origs = Object.keys(s.files).filter((n) => n.startsWith("orig-")).sort();
    card.innerHTML = `
      <div class="top"><span class="emoji">${ICON[m.theme] ?? "📸"}</span><span class="t">${time(s)}</span>
        ${m.ticket ? `<span class="badge">№ ${String(m.ticket).padStart(3, "0")}</span>` : ""}
        <span class="badge ${m.printed ? "printed" : ""}">${m.printed ? `🖨️ ×${m.copies ?? 1}` : "not printed"}</span></div>
      <div class="pics">
        <div class="strip">${s.files["strip.png"] ? thumb(s.files["strip.png"], "Printed strip") : `<div class="none">no strip</div>`}</div>
        <div class="origs">${origs.map((n) => thumb(s.files[n], "Original " + n.match(/\d+/)[0])).join("") || `<div class="none">uploading…</div>`}</div>
      </div>`;
    $("grid").appendChild(card);
  }
  for (const img of $("grid").querySelectorAll("img[data-key]")) io.observe(img);
}
function thumb(key, label) {
  return `<button class="thumb" data-key="${key}" aria-label="${label}"><img data-key="${key}" alt="${label}"></button>`;
}

$("grid").addEventListener("click", async (e) => {
  const b = e.target.closest("button.thumb");
  if (!b) return;
  const key = b.dataset.key;
  $("view").classList.toggle("bw", key.endsWith(".png"));
  $("viewImg").src = await fileURL(key);
  await $("viewImg").decode().catch(() => {});
  $("viewSave").href = $("viewImg").src;
  $("viewSave").download = key.split("/").slice(-2).join("-");
  $("view").classList.add("on");
});
$("viewClose").onclick = () => $("view").classList.remove("on");
$("view").addEventListener("click", (e) => { if (e.target === $("view")) $("view").classList.remove("on"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("view").classList.remove("on"); });

// Download the whole day as one STORE zip, built in the browser.
$("zip").onclick = async () => {
  const d = day, list = sessions.flatMap((s) => Object.entries(s.files).map(([name, key]) => ({ s, name, key })));
  $("zip").disabled = true;
  try {
    const entries = [];
    for (const [i, f] of list.entries()) {
      setStatus(`Fetching ${i + 1}/${list.length}…`);
      const data = new Uint8Array(await (await fileBlob(f.key)).arrayBuffer());
      const at = new Date(f.s.meta?.capturedAt ?? Date.now());
      const folder = at.toTimeString().slice(0, 8).replaceAll(":", "") + "-" + f.s.id;
      entries.push({ name: `cheese-${d}/${folder}/${f.name}`, data, date: at });
    }
    const blob = new Blob(zipStore(entries), { type: "application/zip" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `cheese-${d}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    setStatus(`Saved cheese-${d}.zip (${(blob.size / 1048576).toFixed(1)} MB, ${list.length} files)`);
  } catch (e) {
    if (e.message !== "locked") setStatus("Download failed: " + e.message);
  } finally { $("zip").disabled = false; }
};

$("lockNow").onclick = () => { clearCache(); lock("Photo archive — enter the booth PIN"); };
$("lockForm").onsubmit = (e) => {
  e.preventDefault();
  localStorage.setItem("booth.pin", JSON.stringify($("pin").value.trim()));
  $("pin").value = ""; start();
};

async function start() {
  if (!pin()) return lock();
  $("lock").hidden = true; $("app").hidden = false;
  try { await loadDays(); } catch (e) { if (e.message !== "locked") setStatus("Couldn't load: " + e.message); }
}
start();
</script>
</body>
</html>
