<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Photo Booth · receiptd</title>
<style>
  :root { --fg:#fafafa; --bg:#111; --accent:#ff3b30; --muted:#888; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; }
  .screen.on { display:flex; }
  button { font:inherit; border:0; border-radius:999px; padding:14px 26px; font-weight:600;
    background:#fff; color:#111; cursor:pointer; }
  button.ghost { background:rgba(255,255,255,.12); color:#fff; }
  button:disabled { opacity:.4; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:.02em; }
  p.sub { color:var(--muted); margin:0 0 22px; }

  /* lock */
  #lock input { font:inherit; font-size:28px; text-align:center; letter-spacing:.3em; width:220px;
    padding:12px; border-radius:14px; border:1px solid #333; background:#1b1b1b; color:#fff; margin-bottom:16px; }
  #lockErr { color:var(--accent); min-height:1.4em; margin-top:10px; }

  /* camera */
  #cam { background:#000; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirror { transform:scaleX(-1); }
  #count { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:min(40vw,240px); font-weight:800; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.6); pointer-events:none; }
  #shotNo { position:absolute; top:calc(env(safe-area-inset-top) + 16px); left:0; right:0; text-align:center;
    font-weight:600; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }
  #flash.pop { opacity:1; transition:none; }
  .bar { position:absolute; left:0; right:0; bottom:0; padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(transparent, rgba(0,0,0,.65)); }
  #shutter { width:84px; height:84px; padding:0; border-radius:50%; background:#fff; border:6px solid rgba(255,255,255,.35);
    background-clip:padding-box; }
  #shutter:active { transform:scale(.94); }
  .seg { display:flex; background:rgba(255,255,255,.12); border-radius:999px; padding:4px; }
  .seg button { padding:8px 14px; background:transparent; color:#fff; font-size:14px; }
  .seg button.sel { background:#fff; color:#111; }
  .side { width:120px; display:flex; }
  .side.r { justify-content:flex-end; }
  .icon { padding:12px 14px; font-size:14px; }
  #camErr { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; }

  /* review */
  #review { background:#222; padding:20px 20px calc(env(safe-area-inset-bottom) + 20px); justify-content:flex-start; }
  #paper { flex:1; min-height:0; width:100%; display:flex; justify-content:center; overflow:auto; padding:10px 0 20px; }
  #preview { width:min(86vw, 360px); height:auto; align-self:flex-start; background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.5); image-rendering:pixelated; }
  .actions { display:flex; gap:12px; }
  #status { min-height:1.5em; margin:8px 0 10px; color:#ddd; text-align:center; }

  /* settings */
  #settings { background:rgba(0,0,0,.92); z-index:5; padding:30px; }
  #settings label { display:block; width:min(90vw,380px); margin-bottom:14px; color:#bbb; font-size:14px; }
  #settings input { display:block; width:100%; margin-top:6px; font:inherit; padding:10px 12px; border-radius:10px;
    border:1px solid #333; background:#1b1b1b; color:#fff; }
</style>
</head>
<body>

<section id="lock" class="screen">
  <h1>📸 Photo Booth</h1>
  <p class="sub">Enter the booth PIN to start</p>
  <form id="lockForm" style="display:flex;flex-direction:column;align-items:center">
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div id="lockErr"></div>
</section>

<section id="cam" class="screen">
  <video id="video" class="mirror" playsinline autoplay muted></video>
  <div id="shotNo"></div>
  <div id="count"></div>
  <div id="flash"></div>
  <div id="camErr"></div>
  <div class="bar">
    <div class="side">
      <div class="seg" id="mode">
        <button data-n="1">1</button><button data-n="3" class="sel">Strip</button>
      </div>
    </div>
    <button id="shutter" aria-label="Take photo"></button>
    <div class="side r">
      <button class="ghost icon" id="flip" aria-label="Switch camera">⇄</button>
      <button class="ghost icon" id="gear" aria-label="Settings" style="margin-left:8px">⚙</button>
    </div>
  </div>
</section>

<section id="review" class="screen">
  <div id="paper"><canvas id="preview"></canvas></div>
  <div id="status"></div>
  <div class="actions">
    <button class="ghost" id="retake">Retake</button>
    <button id="print">🖨 Print</button>
  </div>
</section>

<section id="settings" class="screen">
  <h1>Settings</h1>
  <p class="sub">Saved on this device</p>
  <label>Header<input id="sTitle" maxlength="40"></label>
  <label>Footer<input id="sFooter" maxlength="60"></label>
  <label>Countdown (seconds)<input id="sCount" type="number" min="1" max="10"></label>
  <div class="actions">
    <button class="ghost" id="lockNow">Lock booth</button>
    <button id="sDone">Done</button>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const W = 576;                         // 80mm @ 203dpi
  const store = {
    get pin() { return localStorage.getItem("booth.pin") || ""; },
    set pin(v) { v ? localStorage.setItem("booth.pin", v) : localStorage.removeItem("booth.pin"); },
    get title() { return localStorage.getItem("booth.title") ?? "PHOTO BOOTH"; },
    get footer() { return localStorage.getItem("booth.footer") ?? ""; },
    get count() { return Math.min(10, Math.max(1, +(localStorage.getItem("booth.count") || 3))); },
  };
  let shots = 3, facing = "user", stream = null, busy = false, composed = null;

  function show(id) {
    for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id);
  }
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-booth-pin": store.pin, ...(opts.headers || {}) } });
    if (res.status === 401) { store.pin = ""; stopCam(); show("lock"); throw new Error("locked"); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
    return body;
  }

  // ---- lock ------------------------------------------------------------
  $("lockForm").onsubmit = async (e) => {
    e.preventDefault();
    $("lockErr").textContent = "";
    store.pin = $("pin").value.trim();
    try { await api("/api/unlock", { method: "POST" }); $("pin").value = ""; startCam(); }
    catch (err) { $("lockErr").textContent = err.message === "locked" ? "Wrong PIN" : err.message; }
  };

  // ---- camera ----------------------------------------------------------
  async function startCam() {
    show("cam");
    stopCam();
    $("camErr").style.display = "none";
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } },
      });
      $("video").srcObject = stream;
      $("video").classList.toggle("mirror", facing === "user");
    } catch (err) {
      $("camErr").style.display = "flex";
      $("camErr").textContent = "Camera unavailable: " + err.message + ". Allow camera access and reload.";
    }
  }
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

  $("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
  for (const b of $("mode").querySelectorAll("button")) {
    b.onclick = () => {
      shots = +b.dataset.n;
      $("mode").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
    };
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function grab() {
    // Center-crop the live frame to 4:3 at print width.
    const v = $("video");
    const vw = v.videoWidth, vh = v.videoHeight;
    const target = 4 / 3;
    let sw = vw, sh = vh;
    if (vw / vh > target) sw = vh * target; else sh = vw / target;
    const c = document.createElement("canvas");
    c.width = W; c.height = Math.round(W / target);
    const ctx = c.getContext("2d");
    if (facing === "user") { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  $("shutter").onclick = async () => {
    if (busy || !stream) return;
    busy = true;
    const frames = [];
    try {
      for (let i = 0; i < shots; i++) {
        $("shotNo").textContent = shots > 1 ? `Photo ${i + 1} of ${shots}` : "";
        for (let n = store.count; n > 0; n--) { $("count").textContent = n; await sleep(1000); }
        $("count").textContent = "";
        frames.push(grab());
        $("flash").classList.add("pop");
        await sleep(60);
        $("flash").classList.remove("pop");
        if (i < shots - 1) await sleep(900);
      }
    } finally {
      $("shotNo").textContent = "";
      busy = false;
    }
    composed = compose(frames);
    renderPreview(composed);
    $("status").textContent = "";
    $("print").disabled = false;
    show("review");
  };

  // ---- layout ----------------------------------------------------------
  function compose(frames) {
    const pad = 16, gap = 12;
    const title = store.title.trim(), footer = store.footer.trim();
    const date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    const headH = title ? 96 : 24;
    const footH = 70 + (footer ? 34 : 0);
    const photoH = frames[0].height;
    const H = headH + frames.length * photoH + (frames.length - 1) * gap + footH;

    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (title) {
      ctx.font = "800 46px -apple-system, Helvetica, Arial, sans-serif";
      ctx.fillText(title.toUpperCase(), W / 2, headH / 2 + 4, W - 2 * pad);
    }
    let y = headH;
    for (const f of frames) {
      const g = toneMap(f);
      ctx.drawImage(g, pad, y, W - 2 * pad, (W - 2 * pad) * g.height / g.width);
      y += photoH + gap;
    }
    y = y - gap + 34;
    ctx.font = "600 26px -apple-system, Helvetica, Arial, sans-serif";
    ctx.fillText(date, W / 2, y);
    if (footer) {
      ctx.font = "400 24px -apple-system, Helvetica, Arial, sans-serif";
      ctx.fillText(footer, W / 2, y + 34, W - 2 * pad);
    }
    return c;
  }

  // Grayscale + auto-levels + mild S-curve: thermal paper has little
  // dynamic range, so stretch the histogram before the server dithers.
  function toneMap(src) {
    const c = document.createElement("canvas");
    c.width = src.width; c.height = src.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
    const hist = new Uint32Array(256);
    const L = new Uint8ClampedArray(d.length / 4);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      L[j] = l; hist[L[j]]++;
    }
    const total = L.length; let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > total * 0.01) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > total * 0.01) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      let t = Math.min(1, Math.max(0, (L[j] - lo) / span));
      t = t * t * (3 - 2 * t) * 0.6 + t * 0.4;   // gentle S-curve
      t = Math.pow(t, 0.85);                      // lift mids — thermal prints dark
      const v = t * 255;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // Client-side Atkinson preview so guests see roughly what the paper shows.
  function renderPreview(src) {
    const out = $("preview");
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext("2d");
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, out.width, out.height), d = img.data, w = out.width, h = out.height;
    const g = new Float32Array(w * h);
    for (let i = 0; i < g.length; i++) g[i] = d[i * 4];
    const push = (x, y, e) => { if (x >= 0 && x < w && y < h) g[y * w + x] += e; };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, old = g[i], nv = old < 128 ? 0 : 255, e = (old - nv) / 8;
      g[i] = nv;
      push(x + 1, y, e); push(x + 2, y, e); push(x - 1, y + 1, e); push(x, y + 1, e); push(x + 1, y + 1, e); push(x, y + 2, e);
    }
    for (let i = 0; i < g.length; i++) { d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = g[i]; d[i * 4 + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }

  // ---- review / print --------------------------------------------------
  // Pack the dithered preview into 1-bit rows (MSB = leftmost, 1 = black),
  // which the Worker wraps in StarPRNT raster commands — what you see is
  // exactly what prints.
  function packBits(canvas) {
    const w = canvas.width, h = canvas.height, bpr = w / 8;
    const d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
    const out = new Uint8Array(bpr * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4] < 128) out[y * bpr + (x >> 3)] |= 0x80 >> (x & 7);
    }
    let s = "";
    for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
    return { width: w, height: h, bits: btoa(s) };
  }

  $("retake").onclick = () => show("cam");
  $("print").onclick = async () => {
    if (!composed) return;
    $("print").disabled = true;
    $("status").textContent = "Sending to printer…";
    try {
      const job = await api("/api/print", { method: "POST", body: JSON.stringify(packBits($("preview"))) });
      $("status").textContent = job.position > 1 ? `Queued (#${job.position})… 🖨` : "Printing… 🖨";
      const deadline = Date.now() + 30000;
      let final = null;
      while (Date.now() < deadline) {
        await sleep(2000);
        try {
          const s = await api("/api/jobs/" + encodeURIComponent(job.id));
          if (s.status === "completed" || s.status === "failed") { final = s; break; }
        } catch (_) { /* keep waiting */ }
      }
      if (final && final.status === "failed") {
        $("status").textContent = "Print failed: " + (final.error || "unknown error");
        $("print").disabled = false;
        return;
      }
      $("status").textContent = final ? "Printed! Grab your strip ✂️" : "Sent! It should print in a moment.";
      setTimeout(() => { if ($("review").classList.contains("on")) show("cam"); }, 4000);
    } catch (err) {
      if (err.message !== "locked") { $("status").textContent = "Couldn't print: " + err.message; $("print").disabled = false; }
    }
  };

  // ---- settings --------------------------------------------------------
  $("gear").onclick = () => {
    $("sTitle").value = store.title; $("sFooter").value = store.footer; $("sCount").value = store.count;
    show("settings");
  };
  $("sDone").onclick = () => {
    localStorage.setItem("booth.title", $("sTitle").value);
    localStorage.setItem("booth.footer", $("sFooter").value);
    localStorage.setItem("booth.count", $("sCount").value || "3");
    show("cam");
  };
  $("lockNow").onclick = () => { store.pin = ""; stopCam(); show("lock"); };

  // ---- boot ------------------------------------------------------------
  if (store.pin) {
    api("/api/unlock", { method: "POST" }).then(startCam, () => show("lock"));
  } else {
    show("lock");
  }
})();
</script>
</body>
</html>
