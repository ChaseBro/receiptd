<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>📸</title>
<style>
  :root { --p:#a78bfa; --a:#facc15; --bg:#111; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; overflow:hidden; touch-action:manipulation;
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; }
  .screen.on { display:flex; }
  button { font:inherit; border:0; cursor:pointer; background:none; color:inherit; padding:0; }
  .emoji { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }

  /* ---------- lock (adults) ---------- */
  #lock { gap:14px; }
  #lock input { font-size:30px; text-align:center; letter-spacing:.3em; width:230px; padding:12px; border-radius:16px;
    border:2px solid #333; background:#1b1b1b; color:#fff; }
  #lock .go { font-size:40px; width:90px; height:90px; border-radius:50%; background:#fff; }
  #lock.shake input { animation:shake .4s; border-color:#ef4444; }
  @keyframes shake { 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }

  /* ---------- camera ---------- */
  #cam { background:#000; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirror { transform:scaleX(-1); }
  #frameGlow { position:absolute; inset:0; pointer-events:none; border:10px solid var(--p); border-radius:28px;
    box-shadow: inset 0 0 40px color-mix(in srgb, var(--p) 60%, transparent); opacity:.85; }
  #themes { position:absolute; top:calc(env(safe-area-inset-top) + 34px); left:0; right:0; display:flex; gap:8px;
    justify-content:center; padding:6px 14px; z-index:3; overflow-x:auto; scrollbar-width:none; }
  #themes button { flex:0 0 auto; width:min(11.5vw,64px); height:min(11.5vw,64px); border-radius:50%; font-size:min(6.2vw,34px);
    background:rgba(0,0,0,.4); border:3px solid transparent; transition:transform .15s; }
  #themes button.sel { border-color:#fff; background:var(--p); transform:scale(1.18); }
  #dots { position:absolute; top:calc(env(safe-area-inset-top) + 120px); left:0; right:0; display:flex; gap:12px;
    justify-content:center; z-index:3; pointer-events:none; }
  #dots i { width:20px; height:20px; border-radius:50%; border:3px solid #fff; background:transparent; box-shadow:0 2px 8px #0008; }
  #dots i.done { background:#fff; }
  .bottom { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 28px); display:flex;
    align-items:center; justify-content:space-around; z-index:3; }
  #shutter { width:clamp(120px,30vw,200px); height:clamp(120px,30vw,200px); border-radius:50%;
    font-size:clamp(60px,15vw,100px); border:6px solid var(--p);
    background:linear-gradient(135deg, color-mix(in srgb,var(--p) 55%,transparent), color-mix(in srgb,var(--a) 55%,transparent));
    box-shadow:0 10px 40px #0009; animation:bounce 1.6s infinite; }
  #shutter:active { transform:scale(.92); }
  #shutter:disabled { animation:none; opacity:.35; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .round { width:72px; height:72px; border-radius:50%; background:rgba(0,0,0,.45); border:3px solid rgba(255,255,255,.5);
    font-size:34px; display:flex; align-items:center; justify-content:center; }
  /* mode pictograms: one box vs three stacked */
  .mode-ico { display:flex; flex-direction:column; gap:3px; padding:4px; background:#fff; border-radius:4px; }
  .mode-ico b { display:block; width:18px; height:11px; background:var(--p); border-radius:2px; }
  .mode-ico.one { padding:5px; } .mode-ico.one b { width:26px; height:22px; }
  #hotspot { position:absolute; top:0; right:0; width:56px; height:34px; z-index:4; }

  /* countdown / cooldown ring */
  #ring { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:5; pointer-events:none; }
  #ring.on { display:flex; }
  #ring .dim { position:absolute; inset:0; background:#000; opacity:0; transition:opacity .3s; }
  #ring svg { position:relative; width:min(60vw,300px); height:min(60vw,300px); transform:rotate(-90deg); }
  #ring .num { position:absolute; font-size:min(30vw,150px); font-weight:900; color:var(--a);
    text-shadow:0 6px 30px #000a; transition:transform .25s; }
  #ring .num.pop { animation:pop .5s; }
  @keyframes pop { 0%{scale:1.6} 100%{scale:1} }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .4s; z-index:6; }
  #flash.pop { opacity:1; transition:none; }

  /* errors (pictographic) */
  .err { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; background:#000c; z-index:7; font-size:90px; }
  .err.on { display:flex; }
  .big { width:110px; height:110px; border-radius:50%; font-size:56px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 30px #0008; }
  .big.yes { background:#22c55e; } .big.no { background:#ef4444; } .big.neutral { background:#fff; color:#111; }

  /* ---------- review ---------- */
  #review { background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--p) 35%,#222), #111); justify-content:flex-start;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px); }
  #paper { flex:1; min-height:0; width:100%; overflow:auto; display:flex; justify-content:center; padding:4px 0 18px; }
  #paperIn { position:relative; width:min(78vw,340px); align-self:flex-start; }
  #preview { width:100%; display:block; background:#fff; image-rendering:pixelated; box-shadow:0 12px 50px #000a;
    animation:slidein .5s ease-out; }
  @keyframes slidein { from{transform:translateY(-40px); opacity:0} }
  .rot { position:absolute; right:-14px; width:52px; height:52px; border-radius:50%; background:#fff; color:#111;
    font-size:28px; box-shadow:0 4px 14px #0008; display:flex; align-items:center; justify-content:center; }
  .actions { display:flex; gap:56px; }
  #printBtn { animation:bounce 1.6s infinite; }

  /* ---------- printing ---------- */
  #printing { background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--p) 40%,#222), #111); }
  #printer { font-size:130px; position:relative; z-index:2; }
  #slip { width:110px; background:#fff; border-radius:0 0 6px 6px; margin-top:-48px; height:0; box-shadow:0 10px 30px #0008;
    background-image:repeating-linear-gradient(#fff 0 14px, #ddd 14px 18px); }
  #printing.go #slip { animation:feed 6s ease-out forwards; }
  @keyframes feed { to { height:min(45vh,320px); } }
  #queue { margin-top:20px; font-size:40px; min-height:50px; letter-spacing:6px; }
  #done { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:min(50vw,260px); z-index:8; pointer-events:none; }
  #done.on { display:flex; animation:pop .6s; }
  .confetti { position:fixed; top:-40px; font-size:34px; z-index:9; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

  /* ---------- settings (adults) ---------- */
  #settings { background:#000e; z-index:20; overflow:auto; justify-content:flex-start; padding:40px 20px; }
  #settings h2 { margin:0 0 4px; }
  #settings .row { width:min(92vw,420px); margin:10px 0; color:#bbb; font-size:14px; }
  #settings input[type=text], #settings input[type=number] { display:block; width:100%; margin-top:6px; font:inherit;
    padding:10px 12px; border-radius:10px; border:1px solid #333; background:#1b1b1b; color:#fff; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chips button { padding:8px 12px; border-radius:999px; background:#2a2a2a; color:#fff; font-size:14px; }
  .chips button.sel { background:#fff; color:#111; font-weight:700; }
  .pill { padding:12px 20px; border-radius:999px; background:#fff; color:#111; font-weight:700; }
  .pill.ghost { background:#2a2a2a; color:#fff; }
  #settings .hint { font-size:12px; color:#888; margin-top:4px; }
</style>
</head>
<body>

<section id="lock" class="screen">
  <div class="emoji" style="font-size:80px">📸</div>
  <form id="lockForm" style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
    <button class="go emoji" type="submit" aria-label="Unlock">🔓</button>
  </form>
</section>

<section id="cam" class="screen">
  <video id="video" class="mirror" playsinline autoplay muted></video>
  <div id="frameGlow"></div>
  <div id="themes"></div>
  <div id="dots"></div>
  <div id="hotspot" aria-hidden="true"></div>
  <div class="bottom">
    <button class="round" id="mode" aria-label="One or three photos"><span class="mode-ico"><b></b><b></b><b></b></span></button>
    <button id="shutter" class="emoji" aria-label="Take photo">📸</button>
    <button class="round emoji" id="flip" aria-label="Switch camera">🔄</button>
  </div>
  <div id="ring"><div class="dim"></div>
    <svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" stroke="#fff" stroke-opacity=".35" stroke-width="16" fill="none"/>
      <circle id="arc" cx="110" cy="110" r="96" style="stroke:var(--p)" stroke-width="16" fill="none" stroke-linecap="round"/></svg>
    <div class="num emoji" id="num"></div>
  </div>
  <div id="flash"></div>
  <div class="err emoji" id="camErr"><div>📷🚫</div><button class="big neutral" id="camRetry" aria-label="Try again">🔁</button></div>
</section>

<section id="review" class="screen">
  <div id="paper"><div id="paperIn"><canvas id="preview"></canvas></div></div>
  <div class="actions">
    <button class="big no emoji" id="retake" aria-label="Retake">✖️</button>
    <button class="big yes emoji" id="printBtn" aria-label="Print">🖨️</button>
  </div>
</section>

<section id="printing" class="screen">
  <div id="printer" class="emoji">🖨️</div>
  <div id="slip"></div>
  <div id="queue" class="emoji"></div>
  <div class="err emoji" id="printErr"><div>😕</div><div class="actions"><button class="big no" id="printBack" aria-label="Back">✖️</button><button class="big neutral" id="printRetry" aria-label="Try again">🔁</button></div></div>
</section>
<div id="done" class="emoji">🎉</div>

<section id="settings" class="screen">
  <h2>Booth settings</h2>
  <div class="row">Footer text (optional)<input type="text" id="sFooter" maxlength="60"></div>
  <div class="row">Countdown seconds<input type="number" id="sCount" min="1" max="10"></div>
  <div class="row">Anti-ghosting (heat compensation)
    <div class="chips" id="sGain"></div>
    <div class="hint">Print the calibration strip, then pick the band whose greys under the black block match the greys to its right.</div>
  </div>
  <div class="row">Print density<div class="chips" id="sDensity"></div></div>
  <div class="row">Print speed<div class="chips" id="sSpeed"></div><div class="hint">Slower = cooler head = less ghosting.</div></div>
  <div class="row">Sounds<div class="chips" id="sSound"></div></div>
  <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
    <button class="pill ghost" id="calib">🧪 Calibration print</button>
    <button class="pill ghost" id="fs">⛶ Fullscreen</button>
    <button class="pill ghost" id="lockNow">🔒 Lock</button>
    <button class="pill" id="sDone">Done</button>
  </div>
  <div class="row" id="sStatus"></div>
</section>

<script type="module">
import { THEMES, compose, calibrationGray } from "./frames.js";
import { PRINT_WIDTH as W, luminance, packBits, toBase64 } from "./raster.js";

const $ = (id) => document.getElementById(id);
const GAINS = [0, 0.15, 0.3, 0.45, 0.6];               // calibration bands A..E
const UI = {                                             // theme → [primary, accent]
  stars: ["#a78bfa", "#facc15"], hearts: ["#ec4899", "#f9a8d4"], party: ["#ec4899", "#06b6d4"],
  dino: ["#22c55e", "#a3e635"], space: ["#6366f1", "#22d3ee"], film: ["#9ca3af", "#f5f5f5"], plain: ["#2563eb", "#8b5cf6"],
};

// ---------- persisted settings ----------
const S = {
  get(k, d) { const v = localStorage.getItem("booth." + k); return v === null ? d : JSON.parse(v); },
  set(k, v) { v === undefined ? localStorage.removeItem("booth." + k) : localStorage.setItem("booth." + k, JSON.stringify(v)); },
};
const cfg = () => ({
  pin: S.get("pin", ""), theme: S.get("theme", "stars"), shots: S.get("shots", 3),
  footer: S.get("footer", ""), count: Math.min(10, Math.max(1, S.get("count", 3))),
  gain: S.get("gain", 0.3), density: S.get("density", 3), speed: S.get("speed", 2), sound: S.get("sound", true),
});

// ---------- screens / api ----------
function show(id) { for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-booth-pin": cfg().pin } });
  if (res.status === 401) { S.set("pin"); stopCam(); show("lock"); throw new Error("locked"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "HTTP " + res.status);
  return body;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- sound ----------
let ac;
function tone(freq, dur = 0.09, type = "sine", vol = 0.25, at = 0) {
  if (!cfg().sound) return;
  ac ??= new (window.AudioContext || window.webkitAudioContext)();
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  tick: () => tone(660, 0.08, "square", 0.12),
  snap: () => { tone(1400, 0.05, "square", 0.2); tone(500, 0.12, "triangle", 0.25, 0.04); },
  tap: () => tone(520, 0.05, "sine", 0.15),
  yay: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, "triangle", 0.2, i * 0.11)),
  boo: () => [392, 311].forEach((f, i) => tone(f, 0.3, "sine", 0.2, i * 0.2)),
};
const buzz = (p) => navigator.vibrate?.(p);

// ---------- wake lock ----------
let wake;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && stream) keepAwake(); });

// ---------- orientation (tilt sensor) ----------
let tilt = null;
window.addEventListener("deviceorientation", (e) => { if (e.beta !== null) tilt = { beta: e.beta, gamma: e.gamma }; });
async function askMotion() {
  try { if (typeof DeviceOrientationEvent?.requestPermission === "function") await DeviceOrientationEvent.requestPermission(); } catch {}
}
/** Clockwise degrees to rotate a screen-space frame so the world's up is up. */
function uprightRotation() {
  let dev = 0;
  if (tilt) {
    const { beta, gamma } = tilt;
    if (Math.abs(gamma) > 50 && Math.abs(beta) < 40) dev = gamma > 0 ? 90 : 270;
    else if (beta < -45) dev = 180;
  }
  const scr = screen.orientation?.angle ?? window.orientation ?? 0;
  return ((dev + scr) % 360 + 360) % 360;
}

// ---------- lock ----------
$("lockForm").onsubmit = async (e) => {
  e.preventDefault();
  askMotion();
  S.set("pin", $("pin").value.trim());
  try { await api("/api/unlock", { method: "POST" }); $("pin").value = ""; startCam(); }
  catch { $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake"); }
};

// ---------- camera ----------
let stream = null, facing = "user";
async function startCam() {
  show("cam"); stopCam(); $("camErr").classList.remove("on");
  applyTheme(); renderModeIcon(); keepAwake();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } } });
    $("video").srcObject = stream;
    $("video").classList.toggle("mirror", facing === "user");
  } catch { $("camErr").classList.add("on"); }
}
function stopCam() { stream?.getTracks().forEach((t) => t.stop()); stream = null; }
$("camRetry").onclick = () => { sfx.tap(); startCam(); };
$("flip").onclick = () => { sfx.tap(); facing = facing === "user" ? "environment" : "user"; startCam(); };
$("mode").onclick = () => { sfx.tap(); S.set("shots", cfg().shots === 3 ? 1 : 3); renderModeIcon(); };
function renderModeIcon() {
  const one = cfg().shots === 1, ico = $("mode").firstElementChild;
  ico.className = "mode-ico" + (one ? " one" : "");
  ico.innerHTML = one ? "<b></b>" : "<b></b><b></b><b></b>";
  renderDots(0);
}
function renderDots(done) {
  const n = cfg().shots;
  $("dots").innerHTML = n > 1 ? Array.from({ length: n }, (_, i) => `<i class="${i < done ? "done" : ""}"></i>`).join("") : "";
}

// theme picker
function applyTheme() {
  const t = cfg().theme, [p, a] = UI[t] ?? UI.stars;
  document.documentElement.style.setProperty("--p", p);
  document.documentElement.style.setProperty("--a", a);
  $("themes").innerHTML = Object.entries(THEMES).map(([k, v]) =>
    `<button class="emoji ${k === t ? "sel" : ""}" data-k="${k}" aria-label="${k}">${v.icon}</button>`).join("");
  for (const b of $("themes").children) b.onclick = () => { sfx.tap(); S.set("theme", b.dataset.k); applyTheme(); };
}

/** Grab the current frame in screen space (mirrored for selfies), upright. */
function grab() {
  const v = $("video"), scale = Math.min(1, 1440 / Math.max(v.videoWidth, v.videoHeight));
  const fw = Math.round(v.videoWidth * scale), fh = Math.round(v.videoHeight * scale);
  const base = new OffscreenCanvas(fw, fh), bctx = base.getContext("2d");
  if (facing === "user") { bctx.translate(fw, 0); bctx.scale(-1, 1); }
  bctx.drawImage(v, 0, 0, fw, fh);
  return rotate(base, uprightRotation());
}
function rotate(src, deg) {
  if (!deg) return src;
  const swap = deg % 180 !== 0;
  const c = new OffscreenCanvas(swap ? src.height : src.width, swap ? src.width : src.height);
  const ctx = c.getContext("2d");
  ctx.translate(c.width / 2, c.height / 2); ctx.rotate((deg * Math.PI) / 180);
  ctx.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

// ---------- ring (countdown fills, cooldown drains) ----------
const ARC = 2 * Math.PI * 96;
function ring(mode, ms, label) {
  return new Promise((resolve) => {
    const r = $("ring"), arc = $("arc"), num = $("num"), dim = r.querySelector(".dim");
    r.classList.add("on"); arc.style.strokeDasharray = ARC;
    const t0 = performance.now(); let last = -1;
    // Keep the number readable when the phone is turned sideways.
    num.style.transform = `rotate(${-uprightRotation()}deg)`;
    const frame = (now) => {
      const p = Math.min(1, (now - t0) / ms);
      arc.style.strokeDashoffset = mode === "countdown" ? ARC * (1 - p) : ARC * p;
      dim.style.opacity = mode === "countdown" ? 0.45 * p : 0.35 * (1 - p);
      if (mode === "countdown") {
        const left = Math.max(1, Math.ceil((ms - (now - t0)) / 1000));
        if (left !== last) { last = left; num.textContent = left; num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop"); sfx.tick(); }
      } else num.textContent = label;
      if (p < 1) requestAnimationFrame(frame);
      else { r.classList.remove("on"); dim.style.opacity = 0; resolve(); }
    };
    requestAnimationFrame(frame);
  });
}

// ---------- capture ----------
let busy = false, frames = [], rotations = [], seed = 1, lastBits = null;
$("shutter").onclick = async () => {
  if (busy || !stream) return;
  busy = true; $("shutter").disabled = true; askMotion();
  const c = cfg(); frames = []; rotations = [];
  try {
    renderDots(0);
    for (let i = 0; i < c.shots; i++) {
      await ring("countdown", c.count * 1000);
      frames.push(grab()); rotations.push(0);
      sfx.snap(); buzz(40);
      $("flash").classList.add("pop"); await sleep(70); $("flash").classList.remove("pop");
      renderDots(i + 1);
      if (i < c.shots - 1) await sleep(700);
    }
    seed = (Math.random() * 2 ** 31) | 0;
    await buildPreview();
    show("review"); armIdle();
  } finally { busy = false; $("shutter").disabled = false; renderDots(0); }
};

// ---------- dithering worker ----------
const worker = new Worker("./dither.worker.js", { type: "module" });
let jobSeq = 0; const pending = new Map();
worker.onmessage = (e) => { pending.get(e.data.id)?.(e.data.bits); pending.delete(e.data.id); };
function dither(gray, h, segments) {
  return new Promise((resolve) => {
    const id = ++jobSeq; pending.set(id, resolve);
    worker.postMessage({ id, gray, w: W, h, segments }, [gray.buffer]);
  });
}
function drawBits(bits, h) {
  const cv = $("preview"); cv.width = W; cv.height = h;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, h);
  for (let i = 0; i < bits.length; i++) { const v = bits[i] ? 0 : 255; img.data.set([v, v, v, 255], i * 4); }
  ctx.putImageData(img, 0, 0);
}

async function buildPreview() {
  const c = cfg();
  const upright = frames.map((f, i) => rotate(f, rotations[i]));
  const { canvas, layout } = compose(upright, { theme: c.theme, seed, footer: c.footer });
  const ctx = canvas.getContext("2d");
  const gray = luminance(ctx.getImageData(0, 0, W, layout.H).data, W, layout.H);
  const bits = await dither(gray, layout.H, [{ y0: 0, y1: layout.H, opts: { gain: c.gain } }]);
  lastBits = { bits, h: layout.H };
  drawBits(bits, layout.H);
  // ↻ badges on each photo (tap to fix a sideways shot).
  $("paperIn").querySelectorAll(".rot").forEach((b) => b.remove());
  layout.photos.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "rot emoji"; b.textContent = "↻"; b.ariaLabel = "Rotate photo";
    b.style.top = `calc(${((p.y + p.h / 2) / layout.H) * 100}% - 26px)`;
    b.onclick = async () => { sfx.tap(); armIdle(); rotations[i] = (rotations[i] + 90) % 360; await buildPreview(); };
    $("paperIn").appendChild(b);
  });
}

// review idles back to the camera if nobody decides
let idleT;
function armIdle() { clearTimeout(idleT); idleT = setTimeout(() => { if ($("review").classList.contains("on")) show("cam"); }, 45000); }
$("retake").onclick = () => { sfx.tap(); clearTimeout(idleT); show("cam"); };

// ---------- print ----------
const printTimes = [];
function cooldownMs() {   // 1s, growing to 15s when the button gets mashed
  const now = Date.now();
  while (printTimes.length && now - printTimes[0] > 60000) printTimes.shift();
  return printTimes.length < 2 ? 1000 : Math.min(15000, 1000 + (printTimes.length - 1) * 3500);
}

async function sendBits(bits, h) {
  const c = cfg();
  return api("/api/print", { method: "POST",
    body: JSON.stringify({ width: W, height: h, bits: toBase64(packBits(bits, W, h)), density: c.density, speed: c.speed }) });
}

async function printFlow() {
  clearTimeout(idleT);
  show("printing"); $("printErr").classList.remove("on");
  const p = $("printing"); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
  $("queue").textContent = "";
  try {
    const job = await sendBits(lastBits.bits, lastBits.h);
    printTimes.push(Date.now());
    const until = Date.now() + 90000;
    while (Date.now() < until) {
      const s = await api("/api/jobs/" + encodeURIComponent(job.id)).catch(() => ({}));
      if (s.status === "completed") break;
      $("queue").textContent = s.position > 1 ? "⏳" + "🧾".repeat(Math.min(5, s.position - 1)) : "";
      await sleep(2000);
    }
    celebrate();
    await sleep(2600);
    show("cam");
    $("shutter").disabled = true;
    await ring("cooldown", cooldownMs(), "🎉");
    $("shutter").disabled = false;
  } catch (err) {
    if (err.message !== "locked") { sfx.boo(); $("printErr").classList.add("on"); }
  }
}
$("printBtn").onclick = () => { sfx.tap(); printFlow(); };
$("printRetry").onclick = () => { sfx.tap(); printFlow(); };
$("printBack").onclick = () => { sfx.tap(); show("cam"); };

function celebrate() {
  sfx.yay(); buzz([60, 40, 60]);
  const d = $("done"); d.textContent = ["🎉", "🥳", "🤩", "✨"][Math.floor(Math.random() * 4)];
  d.classList.remove("on"); void d.offsetWidth; d.classList.add("on");
  setTimeout(() => d.classList.remove("on"), 2400);
  const bits = ["🎉", "⭐", "💖", "🎈", "✨", THEMES[cfg().theme]?.icon ?? "📸"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("div");
    s.className = "confetti emoji"; s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    s.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
}

// ---------- settings (long-press top-right corner) ----------
let pressT;
$("hotspot").addEventListener("pointerdown", () => { pressT = setTimeout(openSettings, 1500); });
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => $("hotspot").addEventListener(ev, () => clearTimeout(pressT)));

function chips(el, options, key) {
  const cur = cfg()[key];
  el.innerHTML = options.map(([v, label]) => `<button data-v='${JSON.stringify(v)}' class="${v === cur ? "sel" : ""}">${label}</button>`).join("");
  for (const b of el.children) b.onclick = () => { S.set(key, JSON.parse(b.dataset.v)); chips(el, options, key); };
}
function openSettings() {
  const c = cfg();
  $("sFooter").value = c.footer; $("sCount").value = c.count; $("sStatus").textContent = "";
  chips($("sGain"), GAINS.map((g, i) => [g, `${String.fromCharCode(65 + i)} · ${g}`]), "gain");
  chips($("sDensity"), [[5, "−2"], [4, "−1"], [3, "std"], [2, "+1"], [1, "+2"]], "density");
  chips($("sSpeed"), [[0, "fast"], [1, "mid"], [2, "slow"]], "speed");
  chips($("sSound"), [[true, "on"], [false, "off"]], "sound");
  show("settings");
}
$("sDone").onclick = () => {
  S.set("footer", $("sFooter").value.trim()); S.set("count", +$("sCount").value || 3);
  startCam();
};
$("lockNow").onclick = () => { S.set("pin"); stopCam(); show("lock"); };
$("fs").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
$("calib").onclick = async () => {
  $("sStatus").textContent = "Printing calibration strip…";
  try {
    const { gray, H, bandH } = calibrationGray(GAINS);
    const segs = GAINS.map((g, i) => ({
      y0: i === 0 ? 0 : 20 + i * bandH, y1: i === GAINS.length - 1 ? H : 20 + (i + 1) * bandH, opts: { gain: g },
    }));
    const bits = await dither(gray, H, segs);
    await sendBits(bits, H);
    $("sStatus").textContent = "Sent. Pick the band (A–E) with the most even greys below the black block.";
  } catch (e) { $("sStatus").textContent = "Failed: " + e.message; }
};

// ---------- boot ----------
if (cfg().pin) api("/api/unlock", { method: "POST" }).then(startCam, () => show("lock"));
else show("lock");
</script>
</body>
