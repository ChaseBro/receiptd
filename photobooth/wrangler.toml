name = "receiptd-booth"
main = "src/index.ts"
compatibility_date = "2026-04-20"
# Personal Cloudflare account (same as worker/).
account_id = "38b54d999e1a68660cba1c6c96fabcee"

routes = [
  { pattern = "booth.receiptd.sh", custom_domain = true },
]

# Static UI (camera page). /api/* falls through to the Worker script.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
RECEIPTD_API = "https://api.receiptd.sh"
# Server-side dither applied to booth photos. atkinson keeps highlights clean
# on thermal paper; floyd-steinberg is the darker alternative.
DITHER = "atkinson"

# Secrets (wrangler secret put <NAME>):
#   RECEIPTD_API_KEY — rd_live_… with jobs:write + jobs:read only
#   BOOTH_PIN        — shared passcode guests type once per device
