name = "receiptd-booth"
main = "src/index.ts"
compatibility_date = "2026-04-20"
# Personal Cloudflare account (same as worker/).
account_id = "38b54d999e1a68660cba1c6c96fabcee"

routes = [
  { pattern = "booth.receiptd.sh", custom_domain = true },
]

# Static UI (camera page). /api/* runs the Worker script.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Deployed version id → /api/version, so open kiosks auto-reload after deploys.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Same queue DO + R2 as receiptd-cprnt: the booth enqueues StarPRNT jobs
# directly onto the printer's CloudPRNT queue, which that Worker serves on
# poll. The PrinterQueue class lives in (and is migrated by) receiptd-cprnt,
# so deploy worker/ first.
[[durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"
script_name = "receiptd-cprnt"

[[r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

# Private photo archive: every session's original frames + the printed 1-bit
# strip. Never public (no r2.dev, no custom domain); read via PIN-gated
# /api/photos. Create once: `wrangler r2 bucket create receiptd-photos`.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "receiptd-photos"

[[kv_namespaces]]
binding = "JOBS_KV"   # read printer status snapshots (paper out etc.)
id = "f7b184e88c364ae588d56652bbabe7d9"

[vars]
PRINTER_ID = "printer-prod-3838"
PRINTER_MAC = "00:11:62:5a:a9:8b"
# CloudPRNT MQTT trigger (EMQX Serverless "receiptd-printers"). Secrets via
# `wrangler secret put`: MQTT_APP_KEY, MQTT_APP_SECRET, MQTT_PRINTER_PASSWORD.
# MQTT_ENABLED="off" = kill switch: no triggers, and (cprnt) the printer's
# cloudprnt-setting.json 404s so it stays on HTTP polling.
MQTT_ENABLED = "on"
MQTT_API_URL = "https://u2f2f216.ala.us-east-1.emqxsl.com:8443/api/v5"
ARCHIVE_PREFIX = ""

# Secrets (wrangler secret put <NAME>):
#   BOOTH_PIN — shared passcode guests type once per device

# ---------------------------------------------------------------------------
# Staging: `npm run deploy:staging` → https://booth-staging.receiptd.sh
# Same printer queue (real prints), separate Worker + PIN secret. Bindings and
# vars are not inherited by envs, so they're repeated here.
[env.staging]
name = "receiptd-booth-staging"
routes = [
  { pattern = "booth-staging.receiptd.sh", custom_domain = true },
]

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.staging.durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"
script_name = "receiptd-cprnt"

[[env.staging.r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

# Same bucket, but staging only ever reads/writes under staging/.
[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "receiptd-photos"

[[env.staging.kv_namespaces]]
binding = "JOBS_KV"   # read printer status snapshots (paper out etc.)
id = "f7b184e88c364ae588d56652bbabe7d9"

[env.staging.vars]
PRINTER_ID = "printer-prod-3838"
PRINTER_MAC = "00:11:62:5a:a9:8b"
# CloudPRNT MQTT trigger (EMQX Serverless "receiptd-printers"). Secrets via
# `wrangler secret put`: MQTT_APP_KEY, MQTT_APP_SECRET, MQTT_PRINTER_PASSWORD.
# MQTT_ENABLED="off" = kill switch: no triggers, and (cprnt) the printer's
# cloudprnt-setting.json 404s so it stays on HTTP polling.
MQTT_ENABLED = "on"
MQTT_API_URL = "https://u2f2f216.ala.us-east-1.emqxsl.com:8443/api/v5"
ARCHIVE_PREFIX = "staging/"
