name = "receiptd-booth"
main = "src/index.ts"
compatibility_date = "2026-04-20"
# Personal Cloudflare account (same as worker/).
account_id = "38b54d999e1a68660cba1c6c96fabcee"

routes = [
  { pattern = "booth.receiptd.sh", custom_domain = true },
]

# Static UI (camera page). /api/* runs the Worker script.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Deployed version id → /api/version, so open kiosks auto-reload after deploys.
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Same queue DO + R2 as receiptd-cprnt: the booth enqueues StarPRNT jobs
# directly onto the printer's CloudPRNT queue, which that Worker serves on
# poll. The PrinterQueue class lives in (and is migrated by) receiptd-cprnt,
# so deploy worker/ first.
[[durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"
script_name = "receiptd-cprnt"

[[r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

[vars]
PRINTER_ID = "printer-prod-3838"

# Secrets (wrangler secret put <NAME>):
#   BOOTH_PIN — shared passcode guests type once per device

# ---------------------------------------------------------------------------
# Staging: `npm run deploy:staging` → https://booth-staging.receiptd.sh
# Same printer queue (real prints), separate Worker + PIN secret. Bindings and
# vars are not inherited by envs, so they're repeated here.
[env.staging]
name = "receiptd-booth-staging"
routes = [
  { pattern = "booth-staging.receiptd.sh", custom_domain = true },
]

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.staging.durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"
script_name = "receiptd-cprnt"

[[env.staging.r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

[env.staging.vars]
PRINTER_ID = "printer-prod-3838"
