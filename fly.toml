# Fly.io config for receiptd. Run `fly launch --no-deploy` once to create
# the app + volume, then `fly deploy` on changes. See docs/CLOUD_ROADMAP.md
# step 7.

app = "receiptd"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # HOME=/data makes ~/.receiptd resolve to the mounted volume so SQLite,
  # renders, and auth.json survive restarts.
  HOME = "/data"
  CPUTIL_PATH = "/app/cputil-bin/cputil"

[[mounts]]
  source = "receiptd_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale-to-zero — the printer's CloudPRNT poll (~every few seconds when
  # idle) keeps the machine warm during active use.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # chromedp + a rendered receipt is fine in 512MB; 1GB gives headroom for
  # larger HTML and concurrent renders without paging.
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
