name = "receiptd-cprnt"
main = "src/index.ts"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]
# Personal Cloudflare account. Pinned because the wrangler login also reaches
# other accounts; config account_id wins over CLOUDFLARE_ACCOUNT_ID.
account_id = "38b54d999e1a68660cba1c6c96fabcee"

# Production routes. custom_domain=true auto-creates the DNS record in the
# zone on deploy (requires the zone to exist in the same CF account).
routes = [
  { pattern = "cprnt.receiptd.sh", custom_domain = true },
]

# Observability
[observability]
enabled = true

# Durable Object: per-printer job queue (one SQLite-backed instance per
# printerId). Strongly consistent, atomic enqueue/ack. receiptd-booth binds
# the same class via script_name = "receiptd-cprnt".
[[durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrinterQueue"]

# KV: per-printer HTTP Basic secrets + status snapshots. (Pre-DO it also held
# the job queue at printer:<id>:jobs; the DO imports + deletes that once.)
# Create with: wrangler kv namespace create receiptd_jobs
# Then paste the returned id below.
[[kv_namespaces]]
binding = "JOBS_KV"
id = "f7b184e88c364ae588d56652bbabe7d9"

# R2: StarPRNT binaries keyed by job id.
# Create with: wrangler r2 bucket create receiptd-jobs
[[r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

# Secrets (set via `wrangler secret put <NAME>`):
#   FLY_HMAC_SECRET  — shared with Fly app; verifies /admin/* requests
#
# Non-secret vars:
[vars]
# CloudPRNT MQTT trigger (EMQX Serverless "receiptd-printers"). Secrets via
# `wrangler secret put`: MQTT_APP_KEY, MQTT_APP_SECRET, MQTT_PRINTER_PASSWORD.
# MQTT_ENABLED="off" = kill switch: no triggers, and (cprnt) the printer's
# cloudprnt-setting.json 404s so it stays on HTTP polling.
MQTT_ENABLED = "on"
MQTT_API_URL = "https://u2f2f216.ala.us-east-1.emqxsl.com:8443/api/v5"
MQTT_BROKER_HOST = "u2f2f216.ala.us-east-1.emqxsl.com"
MQTT_BROKER_PORT = "8883"
MQTT_PRINTER_USERNAME = "printer-prod-3838"
MQTT_FALLBACK_POLL_SEC = "300"   # safety-net poll; MQTT triggers + booth nudges do the real work
MQTT_SETTINGS_RELOAD_MIN = "1440" # printer re-reads its MQTT settings daily (power cycle = immediate)
# Max KV TTL on job signals (seconds). 24h default — Fly should DELETE on ack.
JOB_SIGNAL_TTL = "86400"

# ---------------------------------------------------------------------------
# Staging: `wrangler deploy --env staging` → receiptd-cprnt-staging.
# Isolated Worker with its OWN PrinterQueue DO namespace (DO storage is
# per-script) and its own FLY_HMAC_SECRET; shares the KV namespace + R2 bucket
# with prod, so only use test printer ids (printer-dq-test-*) here. No route:
# reachable on workers.dev only. Bindings/vars are not inherited by envs.
[env.staging]
name = "receiptd-cprnt-staging"
routes = []
workers_dev = true

[[env.staging.durable_objects.bindings]]
name = "PRINTER_QUEUE"
class_name = "PrinterQueue"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["PrinterQueue"]

[[env.staging.kv_namespaces]]
binding = "JOBS_KV"
id = "f7b184e88c364ae588d56652bbabe7d9"

[[env.staging.r2_buckets]]
binding = "JOBS_R2"
bucket_name = "receiptd-jobs"

[env.staging.vars]
MQTT_ENABLED = "off"   # isolated test worker: never hands the real printer MQTT settings
JOB_SIGNAL_TTL = "86400"
# Short KV dual-read window so dq-smoke.mjs can observe it ending (prod: 30m).
LEGACY_KV_WINDOW_SEC = "120"
